<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — JobReady AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --neon-purple: #bc13fe;
            --neon-yellow: #fff01f;
            --bg: #000000;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated grid background ── */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(188,19,254,.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,243,255,.04) 1px, transparent 1px);
            background-size: 44px 44px;
            animation: gridPulse 10s ease-in-out infinite;
        }
        @keyframes gridPulse { 0%,100%{opacity:.6;} 50%{opacity:1;} }

        /* ── Orbs ── */
        .orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; animation: orbFloat linear infinite; }
        .orb-1 { width: 450px; height: 450px; background: rgba(188,19,254,.08); top: -120px; right: -120px; animation-duration: 22s; }
        .orb-2 { width: 350px; height: 350px; background: rgba(0,243,255,.07); bottom: -100px; left: -100px; animation-duration: 18s; animation-delay: -8s; }
        .orb-3 { width: 280px; height: 280px; background: rgba(57,255,20,.05); top: 50%; left: 20%; animation-duration: 28s; animation-delay: -14s; }
        @keyframes orbFloat {
            0%,100%{transform:translate(0,0) scale(1);}
            33%{transform:translate(-25px,25px) scale(1.04);}
            66%{transform:translate(20px,-20px) scale(.96);}
        }

        /* ── Scan line ── */
        .scan-line { position: fixed; top: 0; left: 0; width: 100%; height: 2px; z-index: 50; background: linear-gradient(90deg, transparent, rgba(188,19,254,.7), transparent); animation: scan 7s linear infinite; opacity: .3; }
        @keyframes scan { from{top:0;} to{top:100vh;} }

        /* ── Particle ── */
        .particle { position: fixed; width: 2px; height: 2px; border-radius: 50%; pointer-events: none; z-index: 1; animation: particleDrift linear infinite; }
        @keyframes particleDrift { 0%{transform:translateY(100vh) scale(0);opacity:0;} 10%{opacity:1;} 90%{opacity:1;} 100%{transform:translateY(-20px) scale(1);opacity:0;} }

        /* ── Card ── */
        .card {
            position: relative; z-index: 10;
            width: min(440px, 94vw);
            background: rgba(10,10,10,.93);
            border: 1px solid rgba(188,19,254,.2);
            backdrop-filter: blur(24px);
            padding: 2.8rem 2.5rem;
            animation: cardReveal .7s cubic-bezier(.22,1,.36,1) both;
            box-shadow: 0 0 40px rgba(188,19,254,.08), 0 0 80px rgba(0,243,255,.04);
        }
        @keyframes cardReveal { from{opacity:0;transform:translateY(28px) scale(.97);} to{opacity:1;transform:none;} }

        .card::before { content:''; position:absolute; top:-1px; left:-1px; width:24px; height:24px; border-top:2px solid var(--neon-purple); border-left:2px solid var(--neon-purple); }
        .card::after  { content:''; position:absolute; bottom:-1px; right:-1px; width:24px; height:24px; border-bottom:2px solid var(--neon-pink); border-right:2px solid var(--neon-pink); }

        .card-topbar { position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--neon-purple),var(--neon-blue),var(--neon-pink)); }

        /* ── Logo ── */
        .logo { text-align:center; margin-bottom:2rem; }
        .logo-icon { font-size:2.5rem; color:var(--neon-purple); animation:iconPulse 2.5s ease-in-out infinite; filter:drop-shadow(0 0 14px rgba(188,19,254,.7)); }
        @keyframes iconPulse { 0%,100%{filter:drop-shadow(0 0 10px rgba(188,19,254,.5));transform:scale(1);} 50%{filter:drop-shadow(0 0 25px rgba(188,19,254,.9));transform:scale(1.08);} }
        .logo-title { font-family:'Orbitron',sans-serif; font-size:1.4rem; font-weight:900; letter-spacing:.12em; background:linear-gradient(135deg,var(--neon-purple),var(--neon-blue),var(--neon-pink)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-top:.4rem; }
        .logo-sub { font-size:.65rem; color:rgba(188,19,254,.5); font-family:'Orbitron',sans-serif; letter-spacing:.3em; margin-top:.2rem; }

        /* ── Flash ── */
        .flash { padding:.7rem 1rem; margin-bottom:1rem; border-left:3px solid; font-family:'Orbitron',sans-serif; font-size:.68rem; letter-spacing:.05em; }
        .flash-error   { border-color:var(--neon-pink); background:rgba(255,0,255,.07); color:var(--neon-pink); }
        .flash-success { border-color:var(--neon-green); background:rgba(57,255,20,.07); color:var(--neon-green); }

        /* ── Form ── */
        .form-group { margin-bottom:1.2rem; position:relative; }
        .form-group .icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#444; font-size:.85rem; transition:color .3s; pointer-events:none; }
        .form-group:focus-within .icon { color:var(--neon-purple); }

        input[type="text"], input[type="email"], input[type="password"] {
            width:100%;
            background:rgba(0,0,0,.6);
            border:1px solid #222;
            color:#fff;
            padding:.85rem 1rem .85rem 2.8rem;
            font-family:'Orbitron',sans-serif; font-size:.7rem; letter-spacing:.08em;
            outline:none;
            transition:border-color .3s, box-shadow .3s;
        }
        input::placeholder { color:#333; }
        input:focus { border-color:var(--neon-purple); box-shadow:0 0 0 1px rgba(188,19,254,.3),0 0 18px rgba(188,19,254,.1); }

        /* strength bar */
        .strength-bar { height:2px; margin-top:4px; background:#111; overflow:hidden; }
        .strength-fill { height:100%; width:0; transition:width .5s, background .5s; }

        /* ── Submit ── */
        .btn-submit { width:100%; padding:.95rem; background:transparent; border:2px solid var(--neon-purple); color:var(--neon-purple); font-family:'Orbitron',sans-serif; font-size:.78rem; font-weight:700; letter-spacing:.15em; cursor:pointer; position:relative; overflow:hidden; transition:color .4s,box-shadow .4s; margin-top:.4rem; }
        .btn-submit::before { content:''; position:absolute; inset:0; background:var(--neon-purple); transform:translateX(-101%); transition:transform .45s cubic-bezier(.22,1,.36,1); }
        .btn-submit:hover::before { transform:translateX(0); }
        .btn-submit:hover { color:#000; box-shadow:0 0 30px rgba(188,19,254,.5); }
        .btn-submit span { position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:.5rem; }

        /* ── Footer ── */
        .card-footer { text-align:center; margin-top:1.5rem; font-family:'Orbitron',sans-serif; font-size:.63rem; letter-spacing:.1em; color:#444; }
        .card-footer a { color:var(--neon-blue); text-decoration:none; transition:color .3s,text-shadow .3s; }
        .card-footer a:hover { color:#fff; text-shadow:0 0 10px rgba(0,243,255,.8); }

        /* badge */
        .badge { display:inline-flex; align-items:center; gap:.35rem; padding:.22rem .7rem; border:1px solid rgba(57,255,20,.3); font-family:'Orbitron',sans-serif; font-size:.52rem; letter-spacing:.15em; color:var(--neon-green); margin-bottom:1.2rem; }
        .badge-dot { width:5px; height:5px; border-radius:50%; background:var(--neon-green); animation:blink 1.2s ease-in-out infinite; box-shadow:0 0 8px var(--neon-green); }
        @keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}

        ::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-track{background:#000;} ::-webkit-scrollbar-thumb{background:linear-gradient(var(--neon-purple),var(--neon-pink));}
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="scan-line"></div>

    <div class="card">
        <div class="card-topbar"></div>

        <div class="logo">
            <div class="badge"><span class="badge-dot"></span> NEW AGENT REGISTRATION</div>
            <div class="logo-icon"><i class="fas fa-microchip"></i></div>
            <div class="logo-title">JobReady AI</div>
            <div class="logo-sub">CREATE NEURAL PROFILE</div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="flash flash-{{ cat }}"><i class="fas fa-{% if cat == 'error' %}exclamation-triangle{% else %}check-circle{% endif %} mr-2"></i>{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/signup" id="signupForm">
            <div class="form-group">
                <span class="icon"><i class="fas fa-user"></i></span>
                <input type="text" name="name" id="nameInput" placeholder="FULL NAME" required autocomplete="name">
            </div>
            <div class="form-group">
                <span class="icon"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" id="emailInput" placeholder="EMAIL ADDRESS" required autocomplete="email">
            </div>
            <div class="form-group">
                <span class="icon"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" id="passwordInput" placeholder="PASSWORD (min 6 chars)" required autocomplete="new-password" oninput="checkStrength(this.value)">
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            </div>
            <div class="form-group">
                <span class="icon"><i class="fas fa-shield-alt"></i></span>
                <input type="password" name="confirm_password" id="confirmInput" placeholder="CONFIRM PASSWORD" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                <span><i class="fas fa-user-plus"></i> ACTIVATE ACCOUNT</span>
            </button>
        </form>

        <div class="card-footer">
            HAVE ACCESS CODE? <a href="/login">SIGN IN &rarr;</a>
        </div>
    </div>

    <script>
        // Particles
        const colors = ['#00f3ff','#ff00ff','#39ff14','#bc13fe','#fff01f'];
        for (let i = 0; i < 22; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const c = colors[Math.floor(Math.random() * colors.length)];
            p.style.cssText = `left:${Math.random()*100}vw;background:${c};box-shadow:0 0 8px ${c};width:${Math.random()*2+1}px;height:${Math.random()*2+1}px;animation-duration:${Math.random()*14+8}s;animation-delay:${Math.random()*10}s;opacity:${Math.random()*0.6+0.2};`;
            document.body.appendChild(p);
        }

        // Password strength
        function checkStrength(v) {
            const fill = document.getElementById('strengthFill');
            let score = 0;
            if (v.length >= 6) score++;
            if (v.length >= 10) score++;
            if (/[A-Z]/.test(v)) score++;
            if (/[0-9]/.test(v)) score++;
            if (/[^A-Za-z0-9]/.test(v)) score++;
            const pct = (score / 5) * 100;
            const col = score <= 1 ? '#ff00ff' : score <= 3 ? '#fff01f' : '#39ff14';
            fill.style.width = pct + '%';
            fill.style.background = col;
        }

        // Client-side match check
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            const p = document.getElementById('passwordInput').value;
            const c = document.getElementById('confirmInput').value;
            if (p !== c) {
                e.preventDefault();
                document.getElementById('confirmInput').style.borderColor = '#ff00ff';
                document.getElementById('confirmInput').style.boxShadow = '0 0 0 1px rgba(255,0,255,.4)';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — JobReady AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --neon-purple: #bc13fe;
            --neon-yellow: #fff01f;
            --bg: #000000;
            --surface: #0a0a0a;
            --border: #1a1a1a;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated background grid ── */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(0,243,255,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(188,19,254,.04) 1px, transparent 1px);
            background-size: 44px 44px;
            animation: gridPulse 8s ease-in-out infinite;
        }
        @keyframes gridPulse {
            0%,100% { opacity: .6; }
            50% { opacity: 1; }
        }

        /* ── Floating orbs ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat linear infinite;
        }
        .orb-1 { width: 400px; height: 400px; background: rgba(0,243,255,.08); top: -100px; left: -100px; animation-duration: 20s; }
        .orb-2 { width: 500px; height: 500px; background: rgba(188,19,254,.07); bottom: -150px; right: -150px; animation-duration: 25s; animation-delay: -10s; }
        .orb-3 { width: 300px; height: 300px; background: rgba(255,0,255,.06); top: 40%; left: 60%; animation-duration: 18s; animation-delay: -5s; }
        @keyframes orbFloat {
            0%,100% { transform: translate(0,0) scale(1); }
            33%      { transform: translate(30px,-30px) scale(1.05); }
            66%      { transform: translate(-20px,20px) scale(.95); }
        }

        /* ── Scan line ── */
        .scan-line {
            position: fixed; top: 0; left: 0; width: 100%; height: 2px; z-index: 50;
            background: linear-gradient(90deg, transparent, rgba(0,243,255,.6), transparent);
            animation: scan 6s linear infinite;
            opacity: .4;
        }
        @keyframes scan { from { top: 0; } to { top: 100vh; } }

        /* ── Floating particles ── */
        .particle {
            position: fixed;
            width: 2px; height: 2px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: particleDrift linear infinite;
        }
        @keyframes particleDrift {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-20px) scale(1); opacity: 0; }
        }

        /* ── Card ── */
        .card {
            position: relative; z-index: 10;
            width: min(420px, 92vw);
            background: rgba(10,10,10,.92);
            border: 1px solid rgba(0,243,255,.18);
            backdrop-filter: blur(24px);
            padding: 3rem 2.5rem;
            animation: cardReveal .7s cubic-bezier(.22,1,.36,1) both;
            box-shadow: 0 0 40px rgba(0,243,255,.08), 0 0 80px rgba(188,19,254,.05);
        }
        @keyframes cardReveal {
            from { opacity: 0; transform: translateY(30px) scale(.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Corner accents */
        .card::before, .card::after {
            content: ''; position: absolute; width: 24px; height: 24px;
        }
        .card::before { top: -1px; right: -1px; border-top: 2px solid var(--neon-blue); border-right: 2px solid var(--neon-blue); }
        .card::after  { bottom: -1px; left: -1px; border-bottom: 2px solid var(--neon-pink); border-left: 2px solid var(--neon-pink); }

        /* Top neon bar */
        .card-topbar {
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
            animation: barShimmer 3s linear infinite;
        }
        @keyframes barShimmer {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* ── Logo ── */
        .logo {
            text-align: center; margin-bottom: 2.5rem;
        }
        .logo-icon {
            font-size: 2.8rem; color: var(--neon-blue);
            animation: iconPulse 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 14px rgba(0,243,255,.7));
        }
        @keyframes iconPulse {
            0%,100% { filter: drop-shadow(0 0 10px rgba(0,243,255,.5)); transform: scale(1); }
            50%      { filter: drop-shadow(0 0 25px rgba(0,243,255,.9)); transform: scale(1.08); }
        }
        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem; font-weight: 900; letter-spacing: .12em;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: .5rem;
        }
        .logo-sub {
            font-size: .7rem; color: rgba(0,243,255,.5);
            font-family: 'Orbitron', sans-serif; letter-spacing: .3em;
            margin-top: .25rem;
        }

        /* ── Flash messages ── */
        .flash { padding: .7rem 1rem; margin-bottom: 1.2rem; border-left: 3px solid; font-family: 'Orbitron', sans-serif; font-size: .7rem; letter-spacing: .05em; }
        .flash-error   { border-color: var(--neon-pink); background: rgba(255,0,255,.07); color: var(--neon-pink); }
        .flash-success { border-color: var(--neon-green); background: rgba(57,255,20,.07); color: var(--neon-green); }

        /* ── Form ── */
        .form-group { margin-bottom: 1.4rem; position: relative; }

        .form-group .icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #444; font-size: .9rem; transition: color .3s;
            pointer-events: none;
        }
        .form-group:focus-within .icon { color: var(--neon-blue); }

        input[type="email"], input[type="password"] {
            width: 100%;
            background: rgba(0,0,0,.6);
            border: 1px solid #222;
            color: #fff;
            padding: .9rem 1rem .9rem 2.8rem;
            font-family: 'Orbitron', sans-serif; font-size: .72rem; letter-spacing: .08em;
            outline: none;
            transition: border-color .3s, box-shadow .3s;
        }
        input::placeholder { color: #333; }
        input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 0 1px rgba(0,243,255,.3), 0 0 20px rgba(0,243,255,.12);
        }

        /* ── Submit button ── */
        .btn-submit {
            width: 100%; padding: 1rem;
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif; font-size: .8rem; font-weight: 700; letter-spacing: .15em;
            cursor: pointer;
            position: relative; overflow: hidden;
            transition: color .4s, box-shadow .4s;
            margin-top: .5rem;
        }
        .btn-submit::before {
            content: '';
            position: absolute; inset: 0;
            background: var(--neon-blue);
            transform: translateX(-101%);
            transition: transform .45s cubic-bezier(.22,1,.36,1);
        }
        .btn-submit:hover::before { transform: translateX(0); }
        .btn-submit:hover {
            color: #000;
            box-shadow: 0 0 30px rgba(0,243,255,.5);
        }
        .btn-submit span { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: .5rem; }

        /* ── Footer link ── */
        .card-footer {
            text-align: center; margin-top: 1.8rem;
            font-family: 'Orbitron', sans-serif; font-size: .65rem; letter-spacing: .1em; color: #444;
        }
        .card-footer a {
            color: var(--neon-pink); text-decoration: none;
            transition: color .3s, text-shadow .3s;
        }
        .card-footer a:hover { color: #fff; text-shadow: 0 0 10px rgba(255,0,255,.8); }

        /* ── Status badge ── */
        .status-badge {
            display: inline-flex; align-items: center; gap: .4rem;
            padding: .25rem .75rem;
            border: 1px solid rgba(57,255,20,.3);
            font-family: 'Orbitron', sans-serif; font-size: .55rem; letter-spacing: .15em; color: var(--neon-green);
            margin-bottom: 1.5rem;
        }
        .status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--neon-green);
            animation: blink 1.2s ease-in-out infinite;
            box-shadow: 0 0 8px var(--neon-green);
        }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.2;} }

        /* scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--neon-blue), var(--neon-purple)); }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="scan-line"></div>

    <div class="card">
        <div class="card-topbar"></div>

        <div class="logo">
            <div class="status-badge"><span class="status-dot"></span> SYSTEM ONLINE</div>
            <div class="logo-icon"><i class="fas fa-atom"></i></div>
            <div class="logo-title">JobReady AI</div>
            <div class="logo-sub">NEURAL AUTHENTICATION</div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="flash flash-{{ cat }}"><i class="fas fa-{% if cat == 'error' %}exclamation-triangle{% else %}check-circle{% endif %} mr-2"></i>{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="form-group">
                <span class="icon"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" placeholder="EMAIL ADDRESS" required autocomplete="email">
            </div>
            <div class="form-group">
                <span class="icon"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" placeholder="PASSWORD" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">
                <span><i class="fas fa-sign-in-alt"></i> INITIALIZE SESSION</span>
            </button>
        </form>

        <div class="card-footer">
            NO ACCESS CODE? <a href="/signup">REQUEST ACCESS &rarr;</a>
        </div>
    </div>

    <script>
        // Spawn floating particles
        const colors = ['#00f3ff','#ff00ff','#39ff14','#bc13fe','#fff01f'];
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const c = colors[Math.floor(Math.random() * colors.length)];
            p.style.cssText = `
                left: ${Math.random() * 100}vw;
                background: ${c};
                box-shadow: 0 0 8px ${c};
                width: ${Math.random() * 2 + 1}px;
                height: ${Math.random() * 2 + 1}px;
                animation-duration: ${Math.random() * 15 + 8}s;
                animation-delay: ${Math.random() * 10}s;
                opacity: ${Math.random() * 0.6 + 0.2};
            `;
            document.body.appendChild(p);
        }
    </script>
</body>
</html>
